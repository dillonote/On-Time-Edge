services:
  - type: web
    name: on-time-edge-copy-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    envVars:
      - key: PROVIDER
        value: template
      - key: PYTHON_VERSION
        value: 3.11.6
